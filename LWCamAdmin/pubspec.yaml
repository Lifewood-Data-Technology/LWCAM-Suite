name: lwcam_admin
description: "LWCam Admin: user/project/device management and app settings for LWCAM — writes PostgreSQL directly and keeps an offline JSON fallback."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.2
  shared_preferences: ^2.5.3
  path: ^1.9.1
  window_manager: ^0.5.1
  # Already in the tree via window_manager; declared explicitly because
  # main.dart calls getPrimaryDisplay directly to clamp the window to the
  # screen. Depending on a transitive package without saying so breaks the
  # day window_manager drops it.
  screen_retriever: any
  bcrypt: ^1.1.3 # pure-Dart password hashing (no native DLL) — SuperAdmin auth
  postgres: ^3.5.0 # pure-Dart PostgreSQL client
  file_picker: ^10.3.2 # station-setup directory pickers

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
